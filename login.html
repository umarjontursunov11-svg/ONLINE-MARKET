<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Kirish — STANDART VA METROLOGIYA MCHJ</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png" />

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --primary-color: #0d6efd;
      --font-family-base: 'Inter', system-ui, -apple-system, sans-serif;
      --font-family-heading: 'Outfit', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-family-base);
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      color: #f8fafc;
    }

    .login-brand-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 1rem;
    }

    .login-title {
      font-family: var(--font-family-heading);
      font-weight: 700;
      font-size: 1.5rem;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
    }

    .form-label {
      font-size: 0.825rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
    }

    .form-control {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.75rem 1rem;
      border-radius: 0.625rem;
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus {
      background-color: rgba(15, 23, 42, 0.85);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .btn-login {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: none;
      font-family: var(--font-family-heading);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.8rem;
      border-radius: 0.625rem;
      color: #ffffff;
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
    }

    .alert-custom {
      font-size: 0.85rem;
      border-radius: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card text-center">
    <img src="/assets/images/logo.png" alt="STANDART VA METROLOGIYA" class="login-brand-logo" />
    <h1 class="login-title">Admin Boshqaruv Paneli</h1>
    <p class="login-subtitle">STANDART VA METROLOGIYA MCHJ</p>

    <div id="errorAlert" class="alert alert-danger alert-custom mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="errorMessage">Foydalanuvchi nomi yoki parol noto'g'ri</span>
    </div>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="mb-3 text-start">
        <label for="usernameInput" class="form-label">Foydalanuvchi Nomi</label>
        <div class="input-group">
          <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-person-fill"></i></span>
          <input type="text" id="usernameInput" class="form-control" placeholder="admin" required autofocus autocomplete="username" />
        </div>
      </div>

      <div class="mb-4 text-start">
        <label for="passwordInput" class="form-label">Parol</label>
        <div class="input-group">
          <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-lock-fill"></i></span>
          <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-login w-100 mb-3">
        <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
        Kirish <i class="bi bi-box-arrow-in-right ms-1"></i>
      </button>

      <div>
        <a href="/" class="text-decoration-none text-muted small">
          <i class="bi bi-arrow-left me-1"></i> Asosiy saytga qaytish
        </a>
      </div>
    </form>
  </div>

  <script>
    async function handleLoginSubmit(event) {
      event.preventDefault();
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const alertEl = document.getElementById('errorAlert');
      const alertMsg = document.getElementById('errorMessage');
      const submitBtn = document.getElementById('submitBtn');
      const btnSpinner = document.getElementById('btnSpinner');

      alertEl.style.display = 'none';
      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          sessionStorage.setItem('sm_admin_logged', 'true');
          window.location.href = '/admin';
        } else {
          alertMsg.textContent = data.message || "Foydalanuvchi nomi yoki parol noto'g'ri.";
          alertEl.style.display = 'block';
        }
      } catch (err) {
        console.error('Login error:', err);
        alertMsg.textContent = "Server bilan bog'lanishda xatolik yuz berdi.";
        alertEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
